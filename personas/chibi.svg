<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Q 版人形助手">
  <!-- Q 版人形（自绘，无厂商标识）：头身比 1:1.35，分层=发后/身/手臂/头/发前/眼口。
       这套分层就是「SVG 能不能画 Q 版人形」的可执行答案：能画，但表情靠替换眼/口组，
       头发飘动这类软体效果要靠 Rive/Live2D（见设计文档 §3）。 -->
  <g class="av-shadow"><ellipse cx="60" cy="110" rx="22" ry="4.5" opacity=".18"/></g>

  <!-- 头发（后层） -->
  <g class="av-hair-back"><path d="M24 62c0-22 16-34 36-34s36 12 36 34c0 16-6 26-10 30H34c-4-4-10-14-10-30Z" fill="#3d4b6b"/></g>

  <!-- 身体 -->
  <g class="av-body">
    <path d="M44 88h32l6 20H38Z" fill="#5b6b8f"/>
    <path d="M44 88h32l2 6H42Z" fill="#7b8cb3"/>
    <rect x="54" y="78" width="12" height="8" rx="3" fill="#f0d3b8"/>
  </g>

  <!-- 手臂（可换成 3 个姿势，这里给"自然下垂"） -->
  <g class="av-arms">
    <path d="M44 90c-5 6-6 12-5 16" stroke="#5b6b8f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M76 90c5 6 6 12 5 16" stroke="#5b6b8f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="39" cy="107" r="3.4" fill="#f0d3b8"/><circle cx="81" cy="107" r="3.4" fill="#f0d3b8"/>
  </g>

  <!-- 头 -->
  <g class="av-head">
    <circle cx="60" cy="52" r="27" fill="#f5d8bd"/>
    <ellipse cx="35" cy="58" rx="4" ry="5" fill="#f0c6a4"/><ellipse cx="85" cy="58" rx="4" ry="5" fill="#f0c6a4"/>

    <!-- 头发（前层：刘海 + 呆毛） -->
    <g class="av-hair-front">
      <path d="M33 46c2-16 14-24 27-24s25 8 27 24c-6-6-12-8-16-6-5-6-14-8-22-4-6 3-11 6-16 10Z" fill="#46567a"/>
      <path d="M62 22c4-6 9-8 12-6-2 4-5 7-9 9Z" fill="#46567a"/>
    </g>

    <!-- 表情组：眼 + 口 + 眉 -->
    <g class="av-expr av-expr-happy">
      <ellipse cx="50" cy="54" rx="6" ry="7.5" fill="#fff"/><ellipse cx="70" cy="54" rx="6" ry="7.5" fill="#fff"/>
      <circle cx="50" cy="55" r="4.4" fill="#2f3b57"/><circle cx="70" cy="55" r="4.4" fill="#2f3b57"/>
      <circle cx="48.4" cy="53" r="1.5" fill="#fff"/><circle cx="68.4" cy="53" r="1.5" fill="#fff"/>
      <path d="M55 66q5 4 10 0" stroke="#8a5b46" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="42" cy="63" rx="3.4" ry="2" fill="#f2a7a7" opacity=".55"/><ellipse cx="78" cy="63" rx="3.4" ry="2" fill="#f2a7a7" opacity=".55"/>
    </g>
    <g class="av-expr av-expr-worry">
      <ellipse cx="50" cy="55" rx="5.6" ry="6.8" fill="#fff"/><ellipse cx="70" cy="55" rx="5.6" ry="6.8" fill="#fff"/>
      <circle cx="50" cy="56" r="4" fill="#2f3b57"/><circle cx="70" cy="56" r="4" fill="#2f3b57"/>
      <path d="M44 45l7 3M76 45l-7 3" stroke="#2f3b57" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M56 68q4-3 8 0" stroke="#8a5b46" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </g>
    <g class="av-expr av-expr-confused">
      <ellipse cx="50" cy="54" rx="5.6" ry="6.8" fill="#fff"/><ellipse cx="70" cy="54" rx="5.6" ry="6.8" fill="#fff"/>
      <circle cx="50" cy="55" r="4" fill="#2f3b57"/><circle cx="70" cy="55" r="4" fill="#2f3b57"/>
      <path d="M55 67h10" stroke="#8a5b46" stroke-width="2.8" stroke-linecap="round"/>
      <g class="av-qmark" fill="none" stroke="#8a8a8a" stroke-width="2.8" stroke-linecap="round"><path d="M86 31c0-4 6-4 6 0 0 3-6 3-6 7"/><circle cx="86" cy="42" r="1.7" fill="#8a8a8a" stroke="none"/></g>
    </g>
    <g class="av-expr av-expr-focused">
      <path d="M44 52h9M67 52h9" stroke="#2f3b57" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="50" cy="56" r="3.2" fill="#2f3b57"/><circle cx="70" cy="56" r="3.2" fill="#2f3b57"/>
      <path d="M55 67h10" stroke="#8a5b46" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </g>

  <g class="av-mark" aria-hidden="true"><circle cx="94" cy="26" r="9" fill="#e0453a"/><g class="av-bang"><rect x="91.4" y="16" width="3.4" height="9.6" rx="1.7" fill="#fff"/><circle cx="93.1" cy="29.4" r="1.9" fill="#fff"/></g></g>
</svg>
